    <style type="text/css">
    #lead_form {
        background-color: #1c1c1c;
        color: white;
    }

    #lead_form label {
        font-size: 11pt;
        font-weight: normal;
    }

    .input_group {
        display: inline-block;
        width: 11% !important;
        margin-left: 2%;
        vertical-align: top; /* top-align so labels share one baseline (the time <select> renders taller than the inputs) */
    }

    .input_group select, .input_group input {
        border-radius: 0;
    }

    #type {
        width: 15% !important;
        display: inline-block;
        text-align: right;
    }

    input[type=radio] {
        display: none;
    }

    input[type=radio] + label {
        color: white !important;
        display: inline-block;
        padding: 4px 12px;
        margin-bottom: 0;
        font-size: 16px;
        line-height: 50px;
        min-width: 100px;
        text-align: center;
        vertical-align: middle;
        cursor: pointer;
        background: #1c1c1c;
        width: 100%;
    }

    input[type=radio]:checked + label, input[type=checkbox]:checked + label{
        background-color: #353938;
    }

    input[type=checkbox]:checked + label:after {
        width: 0;
        height: 0;
        border-top: 14px solid transparent;
        border-bottom: 14px solid transparent;
        display: block;
        content: '';
        position: absolute;
        right: -17px;
        top: calc(50% - 15px);
        background-color: green;
    }

    input[type=submit] {
        background-color: #353938 !important;
        color: white !important;
        width: 13% !important;
        margin-left: 3%;
        display: inline-block;
        padding: 5px;
        border-radius: 50px !important;
        vertical-align: text-bottom;
        margin-bottom: 0;
    }
    #searching_text {
        display: inline-block;
        padding-top: 200px;
        width: 100%;
        text-align: center;
        font-size: 26pt !important;
        color: #fff;
        text-shadow: 1px 0 0 #000, 0 -1px 0 #000, 0 1px 0 #000, -1px 0 0 #000;
    }
		
    @media only screen and (max-width: 600px) {
		.input_group {
            display: block;
            width: 96% !important;
        }
        #type {
            width: 100% !important;
            display: inline-block;
            font-size: 0;
        }
        #type br {
            display: none;
        }
        #lead_form label {
            display: inline-block;
            width: 50%;
            margin: 5px 0 0 0;
        }
        #book_button {
            width: 94% !important;
        }
    }

    /* horizontalv2 base layout (sane defaults; Custom CSS loads after this and overrides) */
    #type { display: block !important; width: 100% !important; text-align: left !important; margin-bottom: 10px; }
    #type br { display: none; }
    #type input[type=radio] + label { display: inline-block; width: auto !important; min-width: 0 !important; margin-right: 6px; }
    #lead_form .lqc-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; align-items: end; }
    #lead_form .lqc-fields .input_group { width: auto !important; margin: 0 !important; display: block; }
    #book_button { display: inline-flex; align-items: center; gap: 8px; width: auto !important; margin-top: 10px; }
    .lqc-cta-arrow { display: inline-block; }
    .lqc-bottom-row { margin-top: 12px; }
    /* Map pins: start (pickup) green, end (dropoff) red. !important beats the marker's inline color;
       declared before printCustomCss() so a customer's Custom CSS (loaded after) can override these. */
    .la-marker-pickup { background-color: #22c55e !important; border-color: #15803d !important; }
    .la-marker-dropoff { background-color: #ef4444 !important; border-color: #b91c1c !important; }

<script type="text/javascript">
	// Address autocomplete is handled server-side by artusmode_autocomplete (geoservice);
	// no Google Maps client library is used. Location biasing (config lat/long, or the
	// visitor's browser GPS as a fallback) is applied via the widget's settings.
	if(jQuery('#date_pickup')[0].type != 'date') jQuery('#date_pickup').datepicker();

	function initialize() {
		function resizeIfNoDropoff() {
			if(!jQuery("#dropoff_address_columns").is(":visible")) {
				window.parent.postMessage({message: '{"width":"100%", "height":"' + orig_height + 'px", "nojack":1}'}, '*');
			}
			if(typeof updateTripMap === 'function') updateTripMap(); // refresh the dark map preview on pick
		}
		var pu_settings = {};
		pu_settings.suggestions = function() { checkHeight(); };
		pu_settings.pick = resizeIfNoDropoff;
		jQuery("#autocomplete_pickup").artusmodeAutocomplete(pu_settings);

		var do_settings = {};
		do_settings.suggestions = function() { checkHeight(); };
		do_settings.pick = resizeIfNoDropoff;
		jQuery("#autocomplete_dropoff").artusmodeAutocomplete(do_settings);
	}

	jQuery(document).ready(function() {
		initialize(); // for address autocompletion
		jQuery("#hourly").hide(); // initial selection is for destination, so hide hourly
         var trip_type = jQuery("input[type=radio][name=trip_type]");

		trip_type.change(function() {
			jQuery(".trip_type").hide();
			jQuery("#"+jQuery(this).val()).show();
		});

        	});

	// Validate form is acceptable
	jQuery("#lead_form").submit(function() {
		var errors = false;
		var message = "There were the following errors when trying to submit your request:\n";

		var trip_type = jQuery("input[name='trip_type']:checked").val();
		var hours = jQuery("#hours").val();

		var date_pu = jQuery("#date_pickup").val();
		var time_pu = jQuery("#time_pickup").val();
        var address_id_pu = jQuery("#autocomplete_pickup_address_id").val();
        var street_number_pu = jQuery("#autocomplete_pickup_street_number").val();
        var street_name_pu  = jQuery("#autocomplete_pickup_street").val();
        var city_pu = jQuery("#autocomplete_pickup_locality").val();
        var state_pu = jQuery("#autocomplete_pickup_administrative_area_level_1").val();
        var country_pu = jQuery("#autocomplete_pickup_country").val();
        var zip_pu= jQuery("#autocomplete_pickup_postal_code").val();
        var lat_pu = jQuery("#autocomplete_pickup_latitude").val();
        var long_pu = jQuery("#autocomplete_pickup_longitude").val();

        var address_id_do = jQuery("#autocomplete_dropoff_address_id").val();
        var street_number_do = jQuery("#autocomplete_dropoff_street_number").val();
        var street_name_do  = jQuery("#autocomplete_dropoff_street").val();
        var city_do = jQuery("#autocomplete_dropoff_locality").val();
        var state_do = jQuery("#autocomplete_dropoff_administrative_area_level_1").val();
        var country_do = jQuery("#autocomplete_dropoff_country").val();
        var zip_do= jQuery("#autocomplete_dropoff_postal_code").val();
        var lat_do = jQuery("#autocomplete_dropoff_latitude").val();
        var long_do = jQuery("#autocomplete_dropoff_longitude").val();

		if(lat_pu == '' || long_pu == '') {
			errors = true;
			message += "\n - Pick-Up address was not recognized.  Please select your address from the suggestions."
		}
		if(!date_pu || !time_pu) {
			errors = true;
			message += "\n - Pick-Up date and time are required, please complete them."
		}
        if(address_id_pu == '' && (lat_pu == '' || long_pu == '')) {
            errors = true;
            message += "\n - Pick-Up address was not recognized.  Please enter one and select your address from the suggestions."
        }
        if(trip_type == "destination" && address_id_do == '' && (lat_do == '' || long_do == '')) {
            errors = true;
			message += "\n - Drop-Off address is required for destination-based trips, and was not recognized.  Please select your address from the suggestions."
		}
		if(trip_type == "hourly" && hours == '') {
			errors = true;
			message += "\n - Estimated hours is required for hourly-based trips.  Please fill it in."
		}

		// Handle the return value
		if(errors) {
						alert(message);
			return false;
		}
		else {
            window.parent.postMessage({message: '{"width":"100%", "height":"680px", "task":"scroll"}'}, '*');

            var lead_form = jQuery("#lead_form");
            lead_form.hide();
            var html = jQuery('html');
			            html.append("<div id='searching_text'><i class='fa fa-sync fa-spin'></i> Loading...</div>");
						return true;
		}
	});

    var highest = 0; // T2421
    var orig_height = 0;
    function checkHeight() {
        var heights = jQuery('html, body').map(function () {
            console.log(jQuery(this));
            console.log(jQuery(this).outerHeight(true));
            return jQuery(this).outerHeight(true);
        }).get();
        var amac_results = jQuery('.artusmode_autocomplete_results');
        if(amac_results != undefined && amac_results.offset() != undefined) heights.push(Math.ceil(amac_results.offset().top + amac_results.height()));

        maxHeight = Math.max.apply(null, heights);
        if(orig_height == 0) orig_height = maxHeight;
        if(!jQuery("#dropoff_address_columns").is(":visible") || maxHeight > highest) {
            window.parent.postMessage({message: '{"width":"100%", "height":"' + maxHeight + 'px", "nojack":1}'}, '*');
            highest = maxHeight;
        }
    }
    checkHeight();

    
        // Dark LA MapLibre address preview. Pins + route come from our geoservice: coords from the
    // server-side autocomplete, the route polyline from /api/v1/geo/route (straight-line fallback),
    // tiles/style from maps.mylimobiz.com. No Google/external map service.
    var lqc_trip_map = null, lqc_markers = [], lqc_marker_color = "#106DBE";
    function lqcClearMap() {
        lqc_markers.forEach(function(m){ if(m && m.remove) m.remove(); });
        lqc_markers = [];
        if(lqc_trip_map && LAMaps.clearAllRoutes) LAMaps.clearAllRoutes(lqc_trip_map);
    }
    function lqcDrawTrip() {
        var puLat = parseFloat(jQuery('#autocomplete_pickup_latitude').val()), puLng = parseFloat(jQuery('#autocomplete_pickup_longitude').val());
        var doLat = parseFloat(jQuery('#autocomplete_dropoff_latitude').val()), doLng = parseFloat(jQuery('#autocomplete_dropoff_longitude').val());
        var hasPu = !isNaN(puLat) && !isNaN(puLng), hasDo = !isNaN(doLat) && !isNaN(doLng);
        lqcClearMap();
        if(hasPu && hasDo && window.LADirections) {
            // Pin colors are driven by CSS (.la-marker-pickup green / .la-marker-dropoff red) so a
            // customer's Custom CSS can override them; only the route line follows the theme color.
            LADirections.displayDirections(lqc_trip_map, {lat: puLat, lng: puLng}, {lat: doLat, lng: doLng}, [], {
                showMarkers: true, fitBounds: true, fallbackToStraightLine: true,
                routeColor: lqc_marker_color
            }).then(function(res) {
                if(res && res.markers) lqc_markers = res.markers;
                if(typeof checkHeight === 'function') checkHeight();
            });
        } else {
            var pt = hasPu ? [puLng, puLat] : (hasDo ? [doLng, doLat] : null);
            if(!pt) return;
            lqc_markers.push(LAMaps.addMarker(lqc_trip_map, pt[0], pt[1], {color: lqc_marker_color}));
            lqc_trip_map.setCenter(pt); lqc_trip_map.setZoom(14);
            if(typeof checkHeight === 'function') checkHeight();
        }
    }
    function updateTripMap() {
        if(!window.LAMaps) return;
        var puLat = parseFloat(jQuery('#autocomplete_pickup_latitude').val()), puLng = parseFloat(jQuery('#autocomplete_pickup_longitude').val());
        var doLat = parseFloat(jQuery('#autocomplete_dropoff_latitude').val()), doLng = parseFloat(jQuery('#autocomplete_dropoff_longitude').val());
        var hasPu = !isNaN(puLat) && !isNaN(puLng), hasDo = !isNaN(doLat) && !isNaN(doLng);
        if(!hasPu && !hasDo) return;
        jQuery('#lqc_trip_map').addClass('lqc-map-visible');
        if(!lqc_trip_map) {
            lqc_trip_map = LAMaps.createMap('lqc_trip_map', {center: hasPu ? [puLng, puLat] : [doLng, doLat], zoom: 13});
            lqc_trip_map.on('load', function(){ lqcDrawTrip(); });
        } else {
            lqcDrawTrip();
        }
    }
    
        jQuery(function(){
        jQuery('#add_return').on('change', function(){
            jQuery('#return_fields').toggle(this.checked);
            if(typeof checkHeight === 'function') checkHeight();
        });
        jQuery("input[name=trip_type]").on('change', function(){
            var isDest = jQuery("input[name=trip_type]:checked").val() === 'destination';
            jQuery('.lqc-return-block').toggle(isDest);
            if(!isDest) { jQuery('#add_return').prop('checked', false); jQuery('#return_fields').hide(); }
            if(typeof checkHeight === 'function') checkHeight();
        });
    });
    </script>

    <script>
        String.prototype.replaceAll = function(search, replacement) {
            var target = this;
            return target.split(search).join(replacement);
        };

        window.alert = function(input) {
            var html = jQuery('html');
            var w = html.width();
            var h = html.height();
            var top = html.offset().top;
            var left = ((w/2) - 300);
            if(left < 0 || w < 768) left = 5;

            var code = "<div style='width: "+w+"px; min-height: "+h+"px; padding-top: 150px;' id='artusmode_alert'>"+
                        "<div style='max-width: calc(100% - 10px); min-height: 200px; margin-top: "+(20+top)+"px; margin-left: "+left+"px;' id='artusmode_alert_inner'>"+
                            input.replaceAll('\n', '<br/>')+
                            "<br style='clear: both;' /><div id='artusmode_alert_close'>Close</div>"+
                        "</div>"+
                    "</div>"+
                "</div>";
            jQuery(html).append(jQuery(code));
            jQuery('#artusmode_alert_close, #artusmode_alert').click(function() {
                jQuery('#artusmode_alert').remove();
            });

            var heights = jQuery('html, body, #artusmode_alert').map(function () {
                return jQuery(this).outerHeight(true);
            }).get();
            var maxHeight = Math.max.apply(null, heights);
            if(document.documentElement.scrollHeight > maxHeight) maxHeight = document.documentElement.scrollHeight;
            window.parent.postMessage({message: '{"height":"'+maxHeight+'px", "task":"scroll", "nojack":1}'}, '*');
        }
    </script>
